<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>தமிழ் Word Quest - Learn to Read Tamil!</title>
  
  <!-- Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23f59e0b'/><text y='70' x='50' text-anchor='middle' font-size='60' fill='white' font-family='sans-serif' font-weight='bold'>த</text></svg>">

  <!-- Suppress non-critical Tailwind CDN banner warning in production -->
  <script>
    (function() {
      const origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        origWarn.apply(console, args);
      };
    })();
  </script>

  <!-- Tailwind CSS CDN with Class Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            tamil: ['"Noto Sans Tamil"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-full min-h-[100dvh] w-full overflow-hidden bg-slate-100/70 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col md:flex-row transition-colors">

  <!-- Mobile Top Navigation Bar (Mobile only) -->
  <header class="md:hidden flex items-center justify-between px-3 h-[52px] bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex-shrink-0 z-50 w-full">
    <div class="flex items-center gap-2">
      <!-- Hamburger Menu Button (Toggle) -->
      <button id="mobile-menu-btn" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 transition-all cursor-pointer flex items-center justify-center w-9 h-9" aria-label="Toggle Menu" aria-expanded="false">
        <svg id="hamburger-icon" class="w-5 h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <svg id="close-icon" class="w-5 h-5 pointer-events-none hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <div class="flex items-center gap-1.5">
        <div class="w-7 h-7 rounded-lg bg-amber-500 text-white flex items-center justify-center text-sm font-black">
          த
        </div>
        <span class="font-black text-sm text-slate-900 dark:text-white">தமிழ் <span class="text-amber-600 dark:text-amber-400">Quest</span></span>
      </div>
    </div>

    <div class="flex items-center gap-1.5 text-xs">
      <div class="font-bold text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-slate-800 px-2 py-1 rounded-lg border border-amber-200 dark:border-slate-700">
        <span id="mobile-stat-streak">1 d</span>
      </div>
      <div class="font-bold text-indigo-700 dark:text-indigo-400 bg-indigo-50 dark:bg-slate-800 px-2 py-1 rounded-lg border border-indigo-200 dark:border-slate-700">
        <span id="mobile-stat-xp">0 XP</span>
      </div>
      <button id="mobile-theme-btn" class="p-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold px-2 py-1 border border-slate-200 dark:border-slate-700 active:scale-95 cursor-pointer">
        Theme
      </button>
    </div>
  </header>

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div id="sidebar-backdrop"></div>

  <!-- Left Sidebar (Collapsible Drawer on Mobile, Fixed Sidebar on Desktop) -->
  <aside id="sidebar" class="md:w-64 lg:w-72 md:h-screen flex-shrink-0 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between p-3.5 sm:p-4 select-none overflow-y-auto">
    
    <div>
      <div class="hidden md:flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-xl bg-amber-500 text-white flex items-center justify-center text-lg font-black shadow-sm">
            த
          </div>
          <div>
            <h1 class="text-sm font-black text-slate-900 dark:text-white leading-tight">
              தமிழ் <span class="text-amber-600 dark:text-amber-400">Quest</span>
            </h1>
            <p class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">154 Words Reading Quest</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <!-- Desktop Theme Toggle -->
          <button id="theme-toggle-btn" class="hidden md:flex p-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all text-xs font-bold items-center gap-1 cursor-pointer" title="Toggle Light / Dark mode">
            <span id="theme-toggle-label">Theme</span>
          </button>
        </div>
      </div>

      <!-- Stats Bar in Sidebar -->
      <div class="grid grid-cols-3 gap-1.5 my-3 text-center">
        <div class="bg-amber-50 dark:bg-slate-800/80 px-1.5 py-1.5 rounded-xl border border-amber-200 dark:border-slate-700">
          <div class="text-[9px] uppercase tracking-wider text-amber-700 dark:text-amber-400 font-bold">Streak</div>
          <div id="stat-streak" class="text-xs font-black text-amber-900 dark:text-amber-200">1 Days</div>
        </div>
        <div class="bg-indigo-50 dark:bg-slate-800/80 px-1.5 py-1.5 rounded-xl border border-indigo-200 dark:border-slate-700">
          <div class="text-[9px] uppercase tracking-wider text-indigo-700 dark:text-indigo-400 font-bold">XP</div>
          <div id="stat-xp" class="text-xs font-black text-indigo-900 dark:text-indigo-200">0 XP</div>
        </div>
        <div class="bg-purple-50 dark:bg-slate-800/80 px-1.5 py-1.5 rounded-xl border border-purple-200 dark:border-slate-700">
          <div class="text-[9px] uppercase tracking-wider text-purple-700 dark:text-purple-400 font-bold">Rank</div>
          <div id="stat-level" class="text-xs font-black text-purple-900 dark:text-purple-200">Lvl 1</div>
        </div>
      </div>

      <!-- Navigation Modules -->
      <div class="space-y-1 mb-4">
        <div class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 dark:text-slate-500 px-2 mb-1">
          Play Modes
        </div>
        <button data-tab="trainer" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Learn to Read
        </button>
        <button data-tab="scramble" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Word Builder
        </button>
        <button data-tab="listen" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Listen & Match
        </button>
        <button data-tab="missing" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Letter Detective
        </button>
        <button data-tab="speed" class="nav-tab-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Speed Challenge ⚡</span>
          <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300 font-extrabold uppercase">60s</span>
        </button>
        <button data-tab="dialogue" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Dialogue (உரையாடல்)
        </button>
        <button data-tab="progress" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Trophies & Stats
        </button>
        <button data-tab="parent" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Parent Zone (Add Words)
        </button>
      </div>

      <!-- Difficulty Level Selectors -->
      <div class="space-y-1">
        <div class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 dark:text-slate-500 px-2 mb-1">
          Difficulty Tier
        </div>
        <button data-level="all" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>All Words (Full Quest)</span>
          <span class="text-[10px] opacity-70">154 words</span>
        </button>
        <button data-level="1" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 1: Root & Pulli</span>
          <span class="text-[10px] opacity-70">20 words</span>
        </button>
        <button data-level="2" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 2: Long 'Aa' (ா)</span>
          <span class="text-[10px] opacity-70">20 words</span>
        </button>
        <button data-level="3" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 3: Sounds of 'i' (ி, ீ)</span>
          <span class="text-[10px] opacity-70">20 words</span>
        </button>
        <button data-level="4" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 4: Curves & Loops</span>
          <span class="text-[10px] opacity-70">20 words</span>
        </button>
        <button data-level="5" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 5: Sound Pairs</span>
          <span class="text-[10px] opacity-70">24 words</span>
        </button>
        <button data-level="6" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 6: Everyday & Actions</span>
          <span class="text-[10px] opacity-70">31 words</span>
        </button>
        <button data-level="7" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 7: School & Dialogue</span>
          <span class="text-[10px] opacity-70">19 words</span>
        </button>
      </div>

      <!-- Study Aids / Learning Toggles -->
      <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
        <div class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 dark:text-slate-500 px-1">
          Study Aids
        </div>

        <!-- English Meaning Toggle -->
        <label class="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80 cursor-pointer select-none hover:bg-slate-100/70 dark:hover:bg-slate-800 transition-colors">
          <div class="flex flex-col pr-2">
            <span class="text-xs font-bold text-slate-800 dark:text-slate-200 leading-tight">English Meaning</span>
            <span class="text-[10px] text-slate-400 dark:text-slate-500 leading-tight">Words & definitions</span>
          </div>
          <div class="relative inline-flex items-center">
            <input type="checkbox" id="toggle-meaning" class="sr-only peer">
            <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-4 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-slate-600 peer-checked:bg-indigo-600"></div>
          </div>
        </label>

        <!-- English Phonic Sound Letters Toggle -->
        <label class="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80 cursor-pointer select-none hover:bg-slate-100/70 dark:hover:bg-slate-800 transition-colors">
          <div class="flex flex-col pr-2">
            <span class="text-xs font-bold text-slate-800 dark:text-slate-200 leading-tight">Phonic Sounds</span>
            <span class="text-[10px] text-slate-400 dark:text-slate-500 leading-tight">Letter sound letters</span>
          </div>
          <div class="relative inline-flex items-center">
            <input type="checkbox" id="toggle-phonics" class="sr-only peer">
            <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-4 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-slate-600 peer-checked:bg-amber-500"></div>
          </div>
        </label>

        <!-- Dialogue Word Highlights Toggle -->
        <label class="flex items-center justify-between p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/80 cursor-pointer select-none hover:bg-slate-100/70 dark:hover:bg-slate-800 transition-colors">
          <div class="flex flex-col pr-2">
            <span class="text-xs font-bold text-slate-800 dark:text-slate-200 leading-tight">Word Highlights</span>
            <span class="text-[10px] text-slate-400 dark:text-slate-500 leading-tight">Dialogue vocabulary pills</span>
          </div>
          <div class="relative inline-flex items-center">
            <input type="checkbox" id="toggle-highlights" class="sr-only peer">
            <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-4 peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-slate-600 peer-checked:bg-teal-600"></div>
          </div>
        </label>
      </div>
    </div>

    <!-- Bottom Footer Mastered Counter -->
    <div class="pt-3 border-t border-slate-100 dark:border-slate-800 text-center">
      <div id="stat-words-count" class="text-xs font-extrabold text-slate-600 dark:text-slate-400">
        0 / 154 Words
      </div>
      <div class="text-[10px] text-slate-400 dark:text-slate-500 mt-0.5">Mastered Library</div>
    </div>

  </aside>

  <!-- Main View Area (Strictly Fits Screen Height, Scrollable on Mobile) -->
  <main class="flex-1 min-h-0 min-w-0 w-full overflow-y-auto flex flex-col justify-between items-center p-2.5 sm:p-4 md:p-6 max-w-full" id="main-content">
    <!-- Populated by JavaScript Components -->
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
