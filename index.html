<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>தமிழ் Word Quest - Learn to Read Tamil!</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            tamil: ['"Noto Sans Tamil"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800">

  <!-- Top Sticky Navigation Bar -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      
      <!-- Logo & App Title -->
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-500 text-white flex items-center justify-center text-xl font-black shadow-md shadow-amber-200">
          த
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-slate-900 leading-tight">
            தமிழ் <span class="text-amber-600 font-extrabold">Word Quest</span>
          </h1>
          <p class="text-[11px] text-slate-400 font-medium hidden sm:block">Learn to read Tamil step-by-step</p>
        </div>
      </div>

      <!-- Stats Bar (XP, Streak, Level) -->
      <div class="flex items-center gap-2 sm:gap-3 text-xs sm:text-sm font-bold">
        <!-- Streak -->
        <div class="flex items-center gap-1 bg-amber-50 text-amber-700 px-3 py-1.5 rounded-xl border border-amber-200" title="Active Streak">
          <span>🔥</span>
          <span id="stat-streak">1 Days</span>
        </div>

        <!-- XP Points -->
        <div class="flex items-center gap-1 bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl border border-indigo-200" title="Experience Points">
          <span>⚡</span>
          <span id="stat-xp">0 XP</span>
        </div>

        <!-- Level Badge -->
        <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white px-3 py-1.5 rounded-xl shadow-sm" id="stat-level" title="Learner Level">
          Lvl 1
        </div>
      </div>

    </div>
  </header>

  <!-- Game Mode Tabs Navigation -->
  <nav class="bg-white border-b border-slate-200 px-3 py-2">
    <div class="max-w-4xl mx-auto flex items-center justify-between sm:justify-center gap-1 sm:gap-2 overflow-x-auto no-scrollbar">
      <button data-tab="trainer" class="nav-tab-btn flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all whitespace-nowrap">
        <span>📖</span> <span>Learn to Read</span>
      </button>

      <button data-tab="scramble" class="nav-tab-btn flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all whitespace-nowrap">
        <span>✍️</span> <span>Word Builder</span>
      </button>

      <button data-tab="listen" class="nav-tab-btn flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all whitespace-nowrap">
        <span>🎧</span> <span>Listen & Match</span>
      </button>

      <button data-tab="missing" class="nav-tab-btn flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all whitespace-nowrap">
        <span>🔍</span> <span>Detective</span>
      </button>

      <button data-tab="progress" class="nav-tab-btn flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold border transition-all whitespace-nowrap">
        <span>🏆</span> <span>Trophies</span>
      </button>
    </div>
  </nav>

  <!-- Main Dynamic View Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 sm:py-8" id="main-content">
    <!-- Populated by JavaScript Components -->
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-xs text-slate-400">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <p>Made for young learners exploring Tamil phonics and words 🌟</p>
      <div id="stat-words-count" class="font-bold text-slate-500">0 / 36 Words Mastered</div>
    </div>
  </footer>

  <!-- App Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
