<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>தமிழ் Word Quest - Learn to Read Tamil!</title>
  
  <!-- Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23f59e0b'/><text y='70' x='50' text-anchor='middle' font-size='60' fill='white' font-family='sans-serif' font-weight='bold'>த</text></svg>">

  <!-- Suppress non-critical Tailwind CDN banner warning in production -->
  <script>
    (function() {
      const origWarn = console.warn;
      console.warn = function(...args) {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        origWarn.apply(console, args);
      };
    })();
  </script>

  <!-- Tailwind CSS CDN with Class Dark Mode -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            tamil: ['"Noto Sans Tamil"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-100/60 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex flex-col md:flex-row transition-colors">

  <!-- Left Sidebar (Desktop / Tablet) -->
  <aside class="w-full md:w-64 lg:w-72 flex-shrink-0 bg-white dark:bg-slate-900 border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between p-3 sm:p-4 select-none z-20 shadow-sm md:h-screen overflow-y-auto">
    
    <!-- Top Brand & Theme Toggle -->
    <div>
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 rounded-xl bg-amber-500 text-white flex items-center justify-center text-lg font-black shadow-sm">
            த
          </div>
          <div>
            <h1 class="text-sm font-black text-slate-900 dark:text-white leading-tight">
              தமிழ் <span class="text-amber-600 dark:text-amber-400">Quest</span>
            </h1>
            <p class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">80 Words Reading Quest</p>
          </div>
        </div>

        <!-- Dark / Light Mode Toggle Button -->
        <button id="theme-toggle-btn" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all text-xs font-bold flex items-center gap-1 cursor-pointer" title="Toggle Light / Dark mode">
          <span id="theme-toggle-label">Theme</span>
        </button>
      </div>

      <!-- Stats Chip Bar -->
      <div class="grid grid-cols-3 gap-1.5 my-3 text-center">
        <div class="bg-amber-50 dark:bg-slate-800/80 px-2 py-1.5 rounded-xl border border-amber-200 dark:border-slate-700">
          <div class="text-[9px] uppercase tracking-wider text-amber-700 dark:text-amber-400 font-bold">Streak</div>
          <div id="stat-streak" class="text-xs font-black text-amber-900 dark:text-amber-200">1 Days</div>
        </div>
        <div class="bg-indigo-50 dark:bg-slate-800/80 px-2 py-1.5 rounded-xl border border-indigo-200 dark:border-slate-700">
          <div class="text-[9px] uppercase tracking-wider text-indigo-700 dark:text-indigo-400 font-bold">XP</div>
          <div id="stat-xp" class="text-xs font-black text-indigo-900 dark:text-indigo-200">0 XP</div>
        </div>
        <div class="bg-purple-50 dark:bg-slate-800/80 px-2 py-1.5 rounded-xl border border-purple-200 dark:border-slate-700">
          <div class="text-[9px] uppercase tracking-wider text-purple-700 dark:text-purple-400 font-bold">Rank</div>
          <div id="stat-level" class="text-xs font-black text-purple-900 dark:text-purple-200">Lvl 1</div>
        </div>
      </div>

      <!-- Navigation Modules -->
      <div class="space-y-1 mb-4">
        <div class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 dark:text-slate-500 px-2 mb-1">
          Play Modes
        </div>
        <button data-tab="trainer" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Learn to Read
        </button>
        <button data-tab="scramble" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Word Builder
        </button>
        <button data-tab="listen" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Listen & Match
        </button>
        <button data-tab="missing" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Letter Detective
        </button>
        <button data-tab="progress" class="nav-tab-btn w-full flex items-center px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          Trophies & Stats
        </button>
      </div>

      <!-- Difficulty Level Selectors -->
      <div class="space-y-1">
        <div class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 dark:text-slate-500 px-2 mb-1">
          Difficulty Tier
        </div>
        <button data-level="1" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 1: Root & Pulli</span>
          <span class="text-[10px] opacity-70">20 words</span>
        </button>
        <button data-level="2" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 2: Long 'Aa' (ா)</span>
          <span class="text-[10px] opacity-70">20 words</span>
        </button>
        <button data-level="3" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 3: Sounds of 'i' (ி, ீ)</span>
          <span class="text-[10px] opacity-70">20 words</span>
        </button>
        <button data-level="4" class="sidebar-level-btn w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all text-left cursor-pointer">
          <span>Level 4: Curves & Loops</span>
          <span class="text-[10px] opacity-70">20 words</span>
        </button>
      </div>
    </div>

    <!-- Bottom Footer Mastered Counter -->
    <div class="pt-3 border-t border-slate-100 dark:border-slate-800 text-center">
      <div id="stat-words-count" class="text-xs font-extrabold text-slate-600 dark:text-slate-400">
        0 / 80 Words
      </div>
      <div class="text-[10px] text-slate-400 dark:text-slate-500 mt-0.5">Mastered Library</div>
    </div>

  </aside>

  <!-- Main View Area (Strictly Fits Screen Height) -->
  <main class="flex-1 h-full overflow-hidden flex flex-col justify-center items-center p-2 sm:p-4 md:p-6" id="main-content">
    <!-- Populated by JavaScript Components -->
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
